name: Deploy to VPS via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menggunakan OAuth Client (menghilangkan warning deprecation authkey)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          client-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/backend-simkost
            git pull origin main
            echo "Deployment Berhasil!"