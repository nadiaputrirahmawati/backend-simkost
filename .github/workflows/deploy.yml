name: CI/CD Pipeline Laravel (PostgreSQL)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # 1. TAHAP CI (Continuous Integration / Test)
  # ==========================================
  test:
    name: Run Tests & Syntax Check
    runs-on: ubuntu-latest

    # Service Container Database PostgreSQL untuk Testing di GitHub Runner
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testing_db
          POSTGRES_USER: runner_user
          POSTGRES_PASSWORD: runner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Environment PHP 8.4 & Ekstensi PostgreSQL
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql
          coverage: none

      # Setup Environment Node.js
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cek Sintaks Seluruh File PHP
      - name: Syntax Check (PHP Lint)
        run: |
          find app routes config -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      # Install Dependensi NPM & Jalankan Test (jika ada)
      - name: Install Node Dependencies & Run Test
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
          fi

      # Install Dependensi Composer
      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      # Jalankan Pengujian Laravel dengan Database PostgreSQL Runner
      - name: Run Laravel Feature & Unit Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing_db
          DB_USERNAME: runner_user
          DB_PASSWORD: runner_password
        run: |
          cp .env.example .env.testing || true
          php artisan key:generate --env=testing || true
          php artisan test

  # ==========================================
  # 2. TAHAP CD (Continuous Deployment ke VPS)
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Menggunakan OAuth Client Tailscale v3
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # Eksekusi Deployment via SSH ke VPS
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /var/www/backend-simkost
            
            # Matikan aplikasi sementara saat deploy
            php artisan down || true
            
            # Reset perubahan lokal jika ada & tarik kode terbaru
            git pull origin main
            
            # Update dependensi Composer produksi
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # Jalankan migrasi database PostgreSQL di server VPS
            php artisan migrate --force
            
            # Bersihkan dan optimasi cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Hidupkan kembali aplikasi
            php artisan up
            
            echo "Deployment Berhasil ke PostgreSQL VPS!"